<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>富立德有限公司｜醫療器材・輪椅・助行器・輔具用品</title>
  <meta name="description" content="富立德有限公司成立於2023年，提供輪椅、助行器、便椅、洗澡椅、拐杖、氣墊床及各式醫療與居家照護用品。">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="/fulide-logo.png">
  <link rel="apple-touch-icon" href="/fulide-logo.png">
  <meta name="theme-color" content="#0f6b48">
  <link rel="canonical" href="https://fulide.com.tw/">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="富立德有限公司">
  <meta property="og:title" content="富立德有限公司｜醫療器材・輔具用品・居家照護">
  <meta property="og:description" content="從日常移動到居家照護，富立德提供實用的醫療器材與輔具用品，協助找到更適合生活需求的選擇。">
  <meta property="og:url" content="https://fulide.com.tw/">
  <meta property="og:image" content="https://fulide.com.tw/fulide-logo.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "富立德有限公司",
    "url": "https://fulide.com.tw/",
    "logo": "https://fulide.com.tw/fulide-logo.png",
    "image": "https://fulide.com.tw/fulide-logo.png",
    "foundingDate": "2023",
    "telephone": "03-439-2068",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "北富里大勇街2巷7弄10號1樓",
      "addressLocality": "平鎮區",
      "addressRegion": "桃園市",
      "addressCountry": "TW"
    },
    "description": "富立德有限公司提供輪椅、助行器、便椅、洗澡椅、拐杖與居家照護相關用品。"
  }
  </script>

  <style>
    :root{
      --green:#0f6b48;
      --green-dark:#0a5238;
      --green-soft:#e9f4ee;
      --mint:#f4faf6;
      --cream:#fbfaf6;
      --text:#24342d;
      --muted:#6c7771;
      --line:#dfe8e2;
      --white:#ffffff;
      --shadow:0 14px 34px rgba(26,72,52,.10);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
      color:var(--text);
      background:var(--white);
      line-height:1.7;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }

    .container{
      width:min(1180px,88%);
      margin:auto;
    }

    /* HEADER */
    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(255,255,255,.97);
      border-bottom:1px solid rgba(15,107,72,.08);
      backdrop-filter:blur(12px);
    }

    .header-inner{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:28px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:13px;
      flex-shrink:0;
    }

    .brand img{
      width:64px;
      height:48px;
      object-fit:contain;
    }

    .brand-text strong{
      display:block;
      font-size:20px;
      letter-spacing:.5px;
      color:#222;
    }

    .brand-text span{
      display:block;
      margin-top:1px;
      font-size:11px;
      letter-spacing:1.5px;
      color:#6d756f;
    }

    nav{
      display:flex;
      align-items:center;
      gap:26px;
      margin-left:auto;
    }

    nav a{
      position:relative;
      font-size:14px;
      font-weight:700;
      color:#424d47;
      padding:8px 0;
    }

    nav a::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:0;
      width:0;
      height:2px;
      background:var(--green);
      transform:translateX(-50%);
      transition:.25s;
    }

    nav a:hover::after,
    nav a.active::after{
      width:100%;
    }

    .phone-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:11px 20px;
      border-radius:999px;
      background:var(--green);
      color:white;
      font-size:14px;
      font-weight:800;
      box-shadow:0 8px 20px rgba(15,107,72,.18);
    }


    /* 統一線性圖示風格 */
    .icon-line,
    .trust-icon svg,
    .category-icon svg,
    .about-stat .icon svg{
      width:22px;
      height:22px;
      stroke:currentColor;
      stroke-width:1.8;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      display:block;
    }

    .trust-icon{
      border-color:#c9dbd1;
      background:#f8fbf9;
      color:var(--green);
    }

    .category-icon{
      border:1px solid #d8e7de;
      background:#eef6f1;
      color:var(--green);
    }

    .about-stat .icon{
      border:1px solid #d8e7de;
      background:#eef6f1;
      color:var(--green);
    }

    /* HERO */
    .hero{
      background:linear-gradient(90deg,#f5f7f4 0%,#f7f7f4 52%,#f2efe7 100%);
      overflow:hidden;
    }

    .hero-grid{
      min-height:590px;
      display:grid;
      grid-template-columns:1.02fr .98fr;
      align-items:stretch;
    }

    .hero-copy{
      padding:78px 5% 72px 0;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .eyebrow{
      color:var(--green);
      font-size:13px;
      font-weight:900;
      letter-spacing:2px;
      margin-bottom:18px;
    }

    .hero h1{
      font-size:58px;
      line-height:1.18;
      letter-spacing:1px;
      margin-bottom:10px;
      color:#26312c;
    }

    .hero h1 .accent{
      display:block;
      color:var(--green);
    }

    .hero-line{
      width:56px;
      height:3px;
      background:var(--green);
      margin:24px 0 20px;
    }

    .hero-sub{
      font-size:18px;
      font-weight:700;
      color:#3e4c45;
      margin-bottom:26px;
    }

    .hero-desc{
      max-width:600px;
      color:var(--muted);
      font-size:16px;
      margin-bottom:30px;
    }

    .trust-row{
      display:flex;
      gap:30px;
      flex-wrap:wrap;
    }

    .trust-item{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:14px;
      color:#46554d;
      font-weight:700;
    }

    .trust-icon{
      width:38px;
      height:38px;
      border:1px solid #b9d3c5;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:var(--green);
      font-size:17px;
      background:white;
    }

    .hero-visual{
      position:relative;
      min-height:590px;
      background:
        linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)),
        url("https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=1400&q=88");
      background-size:cover;
      background-position:center;
    }

    .hero-visual::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,rgba(245,247,244,.85) 0%,rgba(245,247,244,.15) 24%,rgba(0,0,0,.02) 100%);
    }

    /* ABOUT */
    .about{
      padding:90px 0;
      background:var(--white);
    }

    .about-grid{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:60px;
      align-items:center;
    }

    .section-kicker{
      color:var(--green);
      font-size:13px;
      font-weight:900;
      letter-spacing:1.8px;
      margin-bottom:10px;
    }

    .section-title{
      font-size:38px;
      line-height:1.3;
      margin-bottom:24px;
      color:#28332e;
    }

    .about p{
      color:var(--muted);
      font-size:16px;
      margin-bottom:14px;
      max-width:680px;
    }

    .about-card{
      background:var(--white);
      border:1px solid var(--line);
      border-radius:22px;
      padding:30px;
      box-shadow:var(--shadow);
    }

    .about-stat{
      display:flex;
      align-items:center;
      gap:18px;
      padding:18px 0;
      border-bottom:1px solid var(--line);
    }

    .about-stat:last-child{
      border-bottom:none;
    }

    .about-stat .icon{
      width:46px;
      height:46px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:var(--green-soft);
      color:var(--green);
      font-size:20px;
      flex-shrink:0;
    }

    .about-stat span{
      display:block;
      font-size:12px;
      color:#7a857f;
      margin-bottom:3px;
    }

    .about-stat strong{
      font-size:18px;
      color:#25352d;
    }

    /* CATEGORIES */
    .categories{
      padding:84px 0 90px;
      background:var(--cream);
    }

    .section-head{
      text-align:center;
      margin-bottom:42px;
    }

    .section-head .section-title{
      margin-bottom:8px;
    }

    .section-head p{
      color:var(--muted);
    }

    .category-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:18px;
    }

    .category-card{
      min-height:190px;
      padding:24px 18px;
      background:white;
      border:1px solid #e6ece8;
      border-radius:18px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition:.25s;
      box-shadow:0 6px 18px rgba(0,0,0,.035);
    }

    .category-card:hover{
      transform:translateY(-5px);
      border-color:#bfd7ca;
      box-shadow:var(--shadow);
    }

    .category-icon{
      width:58px;
      height:58px;
      border-radius:16px;
      background:var(--green-soft);
      color:var(--green);
      display:grid;
      place-items:center;
      font-size:24px;
    }

    .category-card h3{
      font-size:18px;
      color:#253a30;
      margin-top:20px;
    }

    .category-card p{
      color:#7a847f;
      font-size:13px;
      margin-top:4px;
    }

    .category-arrow{
      align-self:flex-end;
      width:28px;
      height:28px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--green);
      color:white;
      margin-top:12px;
    }

    /* FEATURED */
    .featured{
      padding:90px 0;
      background:white;
    }

    .featured-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .product-card{
      border:1px solid #e8ece9;
      border-radius:18px;
      overflow:hidden;
      background:white;
      transition:.25s;
      box-shadow:0 6px 18px rgba(0,0,0,.035);
    }

    .product-card:hover{
      transform:translateY(-5px);
      box-shadow:var(--shadow);
    }

    .product-image{
      height:240px;
      background:#f7f8f6;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .product-image img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .product-content{
      padding:20px;
    }

    .product-tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      background:var(--green-soft);
      color:var(--green);
      font-size:11px;
      font-weight:800;
      margin-bottom:8px;
    }

    .product-content h3{
      font-size:18px;
      margin-bottom:7px;
    }

    .product-content p{
      color:var(--muted);
      font-size:13px;
      min-height:44px;
    }

    .product-btn{
      display:inline-flex;
      margin-top:15px;
      padding:9px 16px;
      border:1px solid var(--green);
      color:var(--green);
      border-radius:999px;
      font-size:13px;
      font-weight:800;
    }

    .featured-loading{
      grid-column:1/-1;
      padding:48px 20px;
      text-align:center;
      background:#f8faf8;
      color:#7a837e;
      border-radius:18px;
    }

    .all-products{
      text-align:center;
      margin-top:36px;
    }

    .all-products a{
      display:inline-block;
      padding:12px 24px;
      border-radius:999px;
      background:var(--green);
      color:white;
      font-weight:800;
    }

    /* SERVICE STRIP */
    .service-strip{
      padding:26px 0 36px;
      background:white;
    }

    .service-box{
      background:linear-gradient(90deg,#0b6243,#0f7a52);
      color:white;
      border-radius:18px;
      padding:26px 34px;
      display:grid;
      grid-template-columns:1.25fr repeat(3,.72fr) .75fr;
      gap:22px;
      align-items:center;
    }

    .service-main h3{
      font-size:24px;
      margin-bottom:4px;
    }

    .service-main p{
      color:rgba(255,255,255,.78);
      font-size:13px;
    }

    .service-mini{
      border-left:1px solid rgba(255,255,255,.18);
      padding-left:20px;
    }

    .service-mini strong{
      display:block;
      margin-bottom:3px;
    }

    .service-mini span{
      font-size:12px;
      color:rgba(255,255,255,.72);
    }

    .service-contact{
      text-align:right;
    }

    .service-contact a{
      display:inline-block;
      padding:11px 24px;
      border:1px solid white;
      border-radius:999px;
      font-weight:800;
    }

    /* CONTACT */
    .contact{
      padding:88px 0;
      background:var(--mint);
    }

    .contact-grid{
      display:grid;
      grid-template-columns:.92fr 1.08fr;
      gap:34px;
      align-items:stretch;
    }

    .contact-info{
      background:white;
      border-radius:22px;
      padding:34px;
      box-shadow:var(--shadow);
    }

    .contact-info h3{
      font-size:28px;
      margin-bottom:8px;
    }

    .contact-info > p{
      color:var(--muted);
      margin-bottom:24px;
    }

    .contact-item{
      padding:14px 0;
      border-bottom:1px solid var(--line);
    }

    .contact-item:last-child{
      border-bottom:none;
    }

    .contact-item span{
      display:block;
      font-size:12px;
      color:#7d8882;
      margin-bottom:3px;
    }

    .contact-item strong,
    .contact-item a{
      font-size:16px;
      color:#283831;
      font-weight:800;
    }

    .map-box{
      min-height:430px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      background:white;
    }

    .map-box iframe{
      width:100%;
      height:100%;
      min-height:430px;
      border:0;
    }

    /* FOOTER */
    footer{
      background:#f7f8f6;
      border-top:1px solid #e6ebe7;
      padding:44px 0;
    }

    .footer-grid{
      display:grid;
      grid-template-columns:1.2fr .8fr .9fr;
      gap:50px;
    }

    .footer-brand{
      display:flex;
      gap:14px;
      align-items:flex-start;
    }

    .footer-brand img{
      width:62px;
      height:48px;
      object-fit:contain;
    }

    .footer-brand strong{
      font-size:18px;
      display:block;
    }

    .footer-brand span{
      color:#737d77;
      font-size:12px;
    }

    .footer-title{
      font-size:14px;
      font-weight:900;
      margin-bottom:12px;
    }

    .footer-links a,
    .footer-info div{
      display:block;
      color:#6e7872;
      font-size:13px;
      margin-bottom:7px;
    }

    .footer-bottom{
      margin-top:30px;
      padding-top:20px;
      border-top:1px solid #e1e6e2;
      display:flex;
      justify-content:space-between;
      gap:20px;
      color:#7b847f;
      font-size:12px;
    }

    .admin-login-link{
      color:#a5ada8;
    }

    /* RWD */
    @media(max-width:1050px){
      nav{display:none;}
      .hero-grid{grid-template-columns:1fr;}
      .hero-copy{padding:70px 0;}
      .hero-visual{min-height:390px;}
      .about-grid{grid-template-columns:1fr;}
      .category-grid{grid-template-columns:repeat(3,1fr);}
      .featured-grid{grid-template-columns:repeat(2,1fr);}
      .service-box{grid-template-columns:1fr 1fr 1fr;}
      .service-main{grid-column:1/-1;}
      .service-contact{text-align:left;}
    }

    @media(max-width:720px){
      .header-inner{min-height:68px;}
      .brand-text strong{font-size:17px;}
      .phone-pill{padding:9px 14px;font-size:12px;}
      .hero h1{font-size:42px;}
      .hero-grid{min-height:auto;}
      .hero-visual{min-height:300px;}
      .section-title{font-size:31px;}
      .category-grid{grid-template-columns:repeat(2,1fr);}
      .featured-grid{grid-template-columns:1fr;}
      .service-box{grid-template-columns:1fr;}
      .service-mini{border-left:none;border-top:1px solid rgba(255,255,255,.16);padding:14px 0 0;}
      .contact-grid{grid-template-columns:1fr;}
      .footer-grid{grid-template-columns:1fr;}
      .footer-bottom{flex-direction:column;}
    }

    @media(max-width:480px){
      .container{width:min(92%,1180px);}
      .brand img{width:54px;}
      .brand-text span{display:none;}
      .hero-copy{padding:56px 0;}
      .hero h1{font-size:35px;}
      .hero-sub{font-size:16px;}
      .trust-row{gap:14px;}
      .category-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
