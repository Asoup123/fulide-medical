<script>

const SUPABASE_URL =
    "https://sdkgiedglmhmchiietru.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const productGrid =
    document.getElementById("productGrid");

const title =
    document.getElementById("category-title");

const description =
    document.getElementById("category-description");

const modal =
    document.getElementById("productModal");

const modalContent =
    document.getElementById("modalContent");

let allProducts = [];


const categoryText = {

    all: [
        "全部產品",
        "富致康醫療器材產品一覽"
    ],

    "aluminum-wheelchair": [
        "鋁製輪椅",
        "輕量化鋁合金輪椅系列"
    ],

    "steel-wheelchair": [
        "鐵製輪椅",
        "耐用穩固鐵製輪椅系列"
    ],

    rollator: [
        "助步車",
        "行走輔助與移動支撐用品"
    ],

    "commode-chair": [
        "便椅",
        "如廁輔助相關用品"
    ],

    "shower-chair": [
        "洗澡椅",
        "沐浴使用安全輔助用品"
    ],

    walker: [
        "助行器",
        "提升行走穩定與安全"
    ],

    "cane-crutch": [
        "手／拐杖",
        "各式手杖與拐杖用品"
    ],

    "quad-cane": [
        "四腳拐",
        "四點支撐型行走輔具"
    ],

    accessories: [
        "輔助用品",
        "各式醫療與生活輔助用品"
    ]

};


function categoryName(category) {

    return categoryText[category]
        ? categoryText[category][0]
        : category;
}


async function loadProducts() {

    productGrid.innerHTML = `
        <div class="loading-box">
            商品載入中...
        </div>
    `;

    const {
        data,
        error
    } =
        await db
        .from("products")
        .select("*")
        .eq("is_active", true)
        .order(
            "sort_order",
            {
                ascending: true
            }
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );

    if (error) {

        productGrid.innerHTML = `
            <div class="empty-box">
                商品讀取失敗：${escapeHTML(error.message)}
            </div>
        `;

        console.error(error);

        return;
    }

    allProducts =
        data || [];

    const params =
        new URLSearchParams(
            window.location.search
        );

    const requested =
        params.get("category");

    if (
        requested &&
        categoryText[requested]
    ) {
        filterProducts(requested);
    } else {
        filterProducts("all");
    }
}


function filterProducts(category) {

    document
    .querySelectorAll(".category-button")
    .forEach(
        button => {

            button.classList.toggle(
                "active",
                button.dataset.category === category
            );
        }
    );

    if (categoryText[category]) {

        title.textContent =
            categoryText[category][0];

        description.textContent =
            categoryText[category][1];
    }

    const filtered =
        category === "all"
        ?
        allProducts
        :
        allProducts.filter(
            product =>
                product.category === category
        );

    renderProducts(filtered);
}


function renderProducts(products) {

    productGrid.innerHTML = "";

    if (!products.length) {

        productGrid.innerHTML = `
            <div class="empty-box">
                此分類目前尚未新增商品
            </div>
        `;

        return;
    }

    products.forEach(
        product => {

            const card =
                document.createElement("article");

            card.className =
                "product-card";

            const image =
                product.image_urls &&
                product.image_urls.length
                ?
                product.image_urls[0]
                :
                "";

            const features =
                Array.isArray(product.features)
                ?
                product.features.slice(0, 5)
                :
                [];

            card.innerHTML = `

                <div class="product-image">

                    ${
                        product.featured
                        ?
                        `
                        <span class="featured-badge">
                            熱賣商品
                        </span>
                        `
                        :
                        ""
                    }

                    ${
                        image
                        ?
                        `
                        <img
                            src="${escapeAttribute(image)}"
                            alt="${escapeAttribute(product.name)}">
                        `
                        :
                        `
                        <div style="
                            color:#999;
                            text-align:center;
                        ">
                            尚無商品圖片
                        </div>
                        `
                    }

                </div>

                <div class="product-content">

                    <span class="product-type">
                        ${escapeHTML(categoryName(product.category))}
                    </span>

                    <h3>
                        ${escapeHTML(product.name)}
                    </h3>

                    <p class="product-intro">
                        ${
                            escapeHTML(
                                product.short_description
                                ||
                                product.description
                                ||
                                "商品詳細資訊請點擊查看。"
                            )
                        }
                    </p>

                    ${
                        features.length
                        ?
                        `
                        <ul class="product-features">

                            ${
                                features
                                .map(
                                    feature =>
                                        `<li>${escapeHTML(feature)}</li>`
                                )
                                .join("")
                            }

                        </ul>
                        `
                        :
                        ""
                    }

                    ${
                        product.subsidy
                        ?
                        `
                        <div class="subsidy">
                            符合補助項目：
                            ${escapeHTML(product.subsidy)}
                        </div>
                        `
                        :
                        ""
                    }

                    <button
                        class="detail-button"
                        data-product-id="${product.id}">
                        查看詳細資料
                    </button>

                    <a
                        href="index.html#contact"
                        class="ask-button"
                        style="margin-top:10px;">
                        洽詢此產品
                    </a>

                </div>

            `;

            productGrid.appendChild(card);
        }
    );

    document
    .querySelectorAll(".detail-button")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function () {

                    openProduct(
                        button.dataset.productId
                    );
                }
            );
        }
    );
}



function buildVariantTable(variants) {

    if (
        !Array.isArray(variants)
        ||
        !variants.length
    ) {
        return "";
    }

    const specNames = [];

    variants.forEach(
        variant => {

            const specs =
                Array.isArray(variant.specs)
                ?
                variant.specs
                :
                [];

            specs.forEach(
                spec => {

                    if (
                        spec.name
                        &&
                        !specNames.includes(spec.name)
                    ) {
                        specNames.push(spec.name);
                    }
                }
            );
        }
    );

    if (!specNames.length) {
        return "";
    }

    const header = `

        <tr>

            <th>
                型號
            </th>

            ${
                specNames
                .map(
                    name => `
                    <th>
                        ${escapeHTML(name)}
                    </th>
                    `
                )
                .join("")
            }

        </tr>

    `;

    const rows =
        variants
        .map(
            variant => {

                const map = {};

                (variant.specs || [])
                .forEach(
                    spec => {

                        if (spec.name) {
                            map[spec.name] =
                                spec.value || "";
                        }
                    }
                );

                return `

                    <tr>

                        <td class="variant-model">
                            ${escapeHTML(
                                variant.model || "未命名型號"
                            )}
                        </td>

                        ${
                            specNames
                            .map(
                                name => `
                                <td>
                                    ${
                                        map[name]
                                        ?
                                        escapeHTML(map[name])
                                        :
                                        "—"
                                    }
                                </td>
                                `
                            )
                            .join("")
                        }

                    </tr>

                `;
            }
        )
        .join("");

    return `

        <div class="variant-table-wrap">

            <table class="variant-table">

                <thead>
                    ${header}
                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>

        <div class="variant-note">
            不同型號／尺寸可能有不同規格，實際供應狀況歡迎洽詢。
        </div>

    `;
}


function openProduct(id) {

    const product =
        allProducts.find(
            item =>
                item.id === id
        );

    if (!product) {
        return;
    }

    const images =
        Array.isArray(product.image_urls)
        ?
        product.image_urls
        :
        [];

    const features =
        Array.isArray(product.features)
        ?
        product.features
        :
        [];

    const specs =
        Array.isArray(product.specs)
        ?
        product.specs
        :
        [];

    const variants =
        Array.isArray(product.variants)
        ?
        product.variants
        :
        [];

    const firstImage =
        images.length
        ?
        images[0]
        :
        "";

    modalContent.innerHTML = `

        <div class="modal-top">

            <div>

                <div class="main-photo">

                    ${
                        firstImage
                        ?
                        `
                        <img
                            id="mainPhotoImage"
                            src="${escapeAttribute(firstImage)}"
                            alt="${escapeAttribute(product.name)}">
                        `
                        :
                        `
                        <div style="color:#999;">
                            尚無商品圖片
                        </div>
                        `
                    }

                </div>

                ${
                    images.length > 1
                    ?
                    `
                    <div class="thumbnail-list">

                        ${
                            images
                            .map(
                                (image,index) => `
                                <button
                                    class="thumbnail ${index === 0 ? "active" : ""}"
                                    data-image="${escapeAttribute(image)}">

                                    <img
                                        src="${escapeAttribute(image)}"
                                        alt="">

                                </button>
                                `
                            )
                            .join("")
                        }

                    </div>
                    `
                    :
                    ""
                }

            </div>


            <div class="modal-info">

                <span class="modal-category">
                    ${escapeHTML(categoryName(product.category))}
                </span>

                <h2>
                    ${escapeHTML(product.name)}
                </h2>

                <div class="modal-description">
                    ${
                        escapeHTML(
                            product.description
                            ||
                            product.short_description
                            ||
                            ""
                        )
                    }
                </div>

                ${
                    product.subsidy
                    ?
                    `
                    <div class="modal-subsidy">
                        符合補助項目：
                        ${escapeHTML(product.subsidy)}
                    </div>
                    `
                    :
                    ""
                }

                <a
                    href="index.html#contact"
                    class="ask-button"
                    style="
                        display:inline-block;
                        width:auto;
                        margin-top:20px;
                        padding-left:22px;
                        padding-right:22px;
                    ">
                    洽詢此產品
                </a>

            </div>

        </div>


        ${
            features.length
            ?
            `
            <section class="detail-section">

                <h3>
                    商品特色
                </h3>

                <ul class="feature-list">

                    ${
                        features
                        .map(
                            feature =>
                                `<li>${escapeHTML(feature)}</li>`
                        )
                        .join("")
                    }

                </ul>

            </section>
            `
            :
            ""
        }


        ${
            variants.length
            ?
            `
            <section class="detail-section">

                <h3>
                    型號／尺寸規格
                </h3>

                ${buildVariantTable(variants)}

            </section>
            `
            :
            ""
        }


        ${
            specs.length
            ?
            `
            <section class="detail-section">

                <h3>
                    ${variants.length ? "共通規格" : "產品規格"}
                </h3>

                <table class="spec-table">

                    <tbody>

                        ${
                            specs
                            .map(
                                spec => `
                                <tr>
                                    <th>
                                        ${escapeHTML(spec.name)}
                                    </th>
                                    <td>
                                        ${escapeHTML(spec.value)}
                                    </td>
                                </tr>
                                `
                            )
                            .join("")
                        }

                    </tbody>

                </table>

            </section>
            `
            :
            ""
        }

    `;

    modal.classList.add("show");
    document.body.classList.add("modal-open");

    document
    .querySelectorAll(".thumbnail")
    .forEach(
        thumbnail => {

            thumbnail.addEventListener(
                "click",
                function () {

                    document
                    .querySelectorAll(".thumbnail")
                    .forEach(
                        item =>
                            item.classList.remove("active")
                    );

                    thumbnail.classList.add("active");

                    const mainImage =
                        document.getElementById("mainPhotoImage");

                    if (mainImage) {
                        mainImage.src =
                            thumbnail.dataset.image;
                    }
                }
            );
        }
    );
}


function closeModal() {

    modal.classList.remove("show");
    document.body.classList.remove("modal-open");
}


document
.getElementById("modalClose")
.addEventListener(
    "click",
    closeModal
);


modal.addEventListener(
    "click",
    function (event) {

        if (event.target === modal) {
            closeModal();
        }
    }
);


document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Escape") {
            closeModal();
        }
    }
);


document
.querySelectorAll(".category-button")
.forEach(
    button => {

        button.addEventListener(
            "click",
            function () {

                const category =
                    button.dataset.category;

                filterProducts(category);

                const newUrl =
                    category === "all"
                    ?
                    "products.html"
                    :
                    "products.html?category="
                    +
                    encodeURIComponent(category);

                history.replaceState(
                    null,
                    "",
                    newUrl
                );
            }
        );
    }
);


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;
}


function escapeAttribute(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


loadProducts();

</script>

</body>
</html>
