<!DOCTYPE html>
<html lang="zh-TW">
<!--
  富立德有限公司｜商品管理後台
  程式整理版 v8｜2026-09-02

  保留功能：
  - Supabase 登入與管理員 UID 權限
  - 商品新增、編輯、上下架、複製、刪除
  - 商品圖片上傳與 Storage
  - 首頁推薦、維康專區、維康碼
  - 商品特色、規格、型號、補助資訊
  - 固定分類順序
  - 同分類內拖曳排序
  - 長列表拖曳自動捲動

  排序規則：
  鋁製輪椅 → 鐵製輪椅 → 助步車 → 便椅 → 洗澡椅 → 助行器
  → 手／拐杖 → 四腳拐 → 輔助用品 → 配件
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富立德有限公司｜商品管理後台</title>

  <style>
:root{--green:#0f6b48;--green-dark:#0a5238;--green-soft:#e9f4ee;--cream:#fbfaf6;--text:#26342e;--muted:#758079;--line:#dfe7e1;--danger:#c94b4b;--warning:#a76a16;--white:#fff;--shadow:0 14px 35px rgba(27,72,54,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f5f7f4;color:var(--text);line-height:1.6}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,rgba(15,107,72,.10),transparent 32%),#f7f8f4}
.login-card{width:min(440px,100%);background:white;border-radius:26px;padding:38px;box-shadow:var(--shadow);border:1px solid var(--line)}
.login-brand{text-align:center;margin-bottom:28px}
.login-brand img{width:100px;height:78px;object-fit:contain;margin:0 auto 10px}
.login-brand h1{font-size:25px;color:var(--green-dark)}
.login-brand p{color:var(--muted);font-size:14px;margin-top:4px}
.field{margin-bottom:18px}
.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:800}
.field input,.field textarea,.field select{width:100%;border:1px solid #cfdad3;border-radius:12px;background:#fff;padding:12px 14px;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,107,72,.09)}
.field textarea{min-height:110px;resize:vertical}
.login-btn,.primary-btn{width:100%;padding:13px 18px;border-radius:999px;color:white;background:var(--green);font-weight:900}
.login-btn:hover,.primary-btn:hover{background:var(--green-dark)}
.login-msg{min-height:24px;color:var(--danger);font-size:13px;margin-top:12px;text-align:center}
.admin-page{min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;min-height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 4%}
.top-brand{display:flex;align-items:center;gap:12px}
.top-brand img{width:60px;height:45px;object-fit:contain}
.top-brand strong{display:block;color:var(--green-dark);font-size:18px}
.top-brand span{color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:10px;align-items:center}
.outline-btn{padding:9px 16px;border-radius:999px;border:1px solid var(--green);color:var(--green);background:white;font-weight:800}
.outline-btn:hover{background:var(--green-soft)}
.danger-outline{border-color:#e7bcbc;color:var(--danger)}
.container{width:min(1380px,94%);margin:30px auto 60px}
.heading-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}
.heading-row h2{font-size:30px;color:var(--green-dark)}
.heading-row p{color:var(--muted);margin-top:4px}
.add-btn{padding:11px 20px;border-radius:999px;background:var(--green);color:white;font-weight:900;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.stat-card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}
.stat-card span{color:var(--muted);font-size:13px}
.stat-card strong{display:block;margin-top:4px;font-size:28px;color:var(--green-dark)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 12px;outline:none}
.toolbar input{flex:1;min-width:230px}
.product-list{display:grid;gap:14px}
.product-row{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:38px 92px 1.4fr .85fr .75fr auto;gap:14px;align-items:center}
.drag-handle{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#f2f5f3;color:#7a857f;font-size:20px;cursor:grab;user-select:none;touch-action:none}
.drag-handle:active{cursor:grabbing}
.product-row.sortable-ghost{opacity:.35;background:#eef6f1}
.product-row.sortable-chosen{box-shadow:0 16px 34px rgba(15,107,72,.16);user-select:none}
.product-row.sortable-drag{opacity:.95;cursor:grabbing}
.thumb{width:92px;height:92px;border-radius:14px;background:#f1f4f1;overflow:hidden;display:grid;place-items:center;color:#9aa39e;font-size:12px}
.thumb img{width:100%;height:100%;object-fit:contain}
.product-name{font-size:18px;font-weight:900;margin-bottom:4px}
.product-desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:900;width:max-content}
.pill.active{background:#e5f5eb;color:#167445}
.pill.inactive{background:#f3efef;color:#8b5a5a}
.pill.featured{background:#fff4d9;color:#8a6410;margin-top:7px}
.pill.weikang{background:#e9f0ff;color:#315da8;margin-top:7px}
.weikang-code-field{margin-top:4px;padding:14px 16px;border:1px solid #d9e3f4;border-radius:12px;background:#f7faff}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:5;pointer-events:auto}
.row-actions button{position:relative;z-index:6;pointer-events:auto}
.small-btn{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:800;background:#eef4f0;color:var(--green-dark)}
.small-btn:hover{background:#e0ece5}
.small-btn.warn{background:#fff2df;color:var(--warning)}
.small-btn.danger{background:#fff0f0;color:var(--danger)}
.empty-box{padding:55px 20px;text-align:center;background:white;color:var(--muted);border:1px dashed #cdd9d2;border-radius:18px}
.modal{position:fixed;inset:0;z-index:500;background:rgba(22,35,29,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.modal-card{width:min(1000px,100%);background:white;border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.22);margin:20px 0;overflow:hidden}
.modal-head{position:sticky;top:0;z-index:5;padding:18px 24px;border-bottom:1px solid var(--line);background:white;display:flex;justify-content:space-between;align-items:center;gap:15px}
.modal-head h3{color:var(--green-dark);font-size:23px}
.close-btn{width:38px;height:38px;border-radius:50%;background:#f0f3f1;font-size:20px}
.form-body{padding:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.full{grid-column:1/-1}
.checkbox-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:8px 0}
.check-label{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:800}
.check-label input{width:18px;height:18px;accent-color:var(--green)}
.section-box{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fbfcfb}
.section-box h4{margin-bottom:12px;color:var(--green-dark)}
.hint{color:var(--muted);font-size:12px;margin-bottom:10px}
.image-upload{border:2px dashed #c7d7cd;border-radius:16px;background:#f8fbf9;padding:22px;text-align:center}
.image-upload input{margin-top:10px}
.image-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}
.preview-item{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white;aspect-ratio:1/1;cursor:grab;user-select:none}.preview-item:active{cursor:grabbing}.preview-item.sortable-ghost{opacity:.35}.preview-item.sortable-chosen{box-shadow:0 0 0 2px rgba(15,118,85,.25)}
.preview-item img{width:100%;height:100%;object-fit:contain}
.preview-remove{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(201,75,75,.92);color:white;font-weight:900}
.dynamic-list{display:grid;gap:10px}
.dynamic-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.dynamic-row input{width:100%;border:1px solid #d2dcd5;border-radius:10px;padding:10px}
.remove-row{padding:0 12px;border-radius:10px;background:#fff0f0;color:var(--danger);font-weight:900}
.add-row-btn{margin-top:10px;padding:8px 13px;border-radius:10px;background:var(--green-soft);color:var(--green-dark);font-weight:800}
.save-bar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:white}
.cancel-btn{padding:11px 20px;border-radius:999px;background:#eef1ef;color:#4d5953;font-weight:800}
.save-btn{min-width:150px;padding:11px 22px;border-radius:999px;background:var(--green);color:white;font-weight:900}
.save-btn:disabled{opacity:.55;cursor:not-allowed}
.toast{position:fixed;right:22px;bottom:22px;z-index:1000;max-width:380px;padding:14px 18px;border-radius:14px;color:white;background:#253c32;box-shadow:var(--shadow);font-size:14px}
@media(max-width:950px){.product-row{grid-template-columns:34px 78px 1fr}
.product-row >:nth-child(4),.product-row >:nth-child(5),.row-actions{grid-column:3}
.row-actions{justify-content:flex-start}
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
.image-preview{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){.topbar{align-items:flex-start}
.top-actions{flex-direction:column;align-items:flex-end}
.heading-row{align-items:flex-start;flex-direction:column}
.stats{grid-template-columns:1fr}
.product-row{grid-template-columns:34px 1fr}
.thumb{width:100%;height:180px}
.product-row > *{grid-column:1 / -1!important}
.product-row > .drag-handle{grid-column:1!important}
.image-preview{grid-template-columns:repeat(2,1fr)}
.dynamic-row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<section id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="fulide-logo.png" alt="富立德有限公司 Logo">
      <h1>商品管理後台</h1>
      <p>富立德有限公司</p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="loginPassword">密碼</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>

      <button class="login-btn" type="submit">登入管理後台</button>
      <div id="loginMsg" class="login-msg"></div>
    </form>
  </div>
</section>

<section id="adminPage" class="admin-page hidden">
  <header class="topbar">
    <div class="top-brand">
      <img src="fulide-logo.png" alt="富立德有限公司 Logo">
      <div>
        <strong>富立德有限公司</strong>
        <span>商品管理後台</span>
      </div>
    </div>

    <div class="top-actions">
      <a class="outline-btn" href="index.html" target="_blank">查看網站</a>
      <button id="logoutBtn" class="outline-btn danger-outline">登出</button>
    </div>
  </header>

  <main class="container">
    <div class="heading-row">
      <div>
        <h2>商品管理</h2>
        <p>新增、編輯、上架、下架與管理商品圖片。</p>
      </div>
      <button id="newProductBtn" class="add-btn">＋ 新增商品</button>
    </div>

    <section class="stats">
      <div class="stat-card">
        <span>全部商品</span>
        <strong id="statAll">0</strong>
      </div>
      <div class="stat-card">
        <span>上架中</span>
        <strong id="statActive">0</strong>
      </div>
      <div class="stat-card">
        <span>已下架</span>
        <strong id="statInactive">0</strong>
      </div>
    </section>

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="搜尋商品名稱、描述...">

      <select id="statusFilter">
        <option value="all">全部狀態</option>
        <option value="active">上架中</option>
        <option value="inactive">已下架</option>
      </select>

      <select id="categoryFilter">
        <option value="all">全部分類</option>
        <option value="aluminum-wheelchair">鋁製輪椅</option>
        <option value="steel-wheelchair">鐵製輪椅</option>
        <option value="rollator">助步車</option>
        <option value="commode-chair">便椅</option>
        <option value="shower-chair">洗澡椅</option>
        <option value="walker">助行器</option>
        <option value="cane-crutch">手／拐杖</option>
        <option value="quad-cane">四腳拐</option>
        <option value="accessories">輔助用品</option>
        <option value="parts-accessories">配件</option>
      </select>
    </div>

    <div id="productList" class="product-list">
      <div class="empty-box">商品載入中...</div>
    </div>
  </main>
</section>

<div id="productModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">新增商品</h3>
      <button id="closeModalBtn" class="close-btn" type="button">×</button>
    </div>

    <form id="productForm">
      <div class="form-body">
        <input id="productId" type="hidden">

        <div class="form-grid">
          <div class="field">
            <label for="productName">商品名稱 *</label>
            <input id="productName" type="text" required>
          </div>

          <div class="field">
            <label for="productCategory">產品分類 *</label>
            <select id="productCategory" required>
              <option value="aluminum-wheelchair">鋁製輪椅</option>
              <option value="steel-wheelchair">鐵製輪椅</option>
              <option value="rollator">助步車</option>
              <option value="commode-chair">便椅</option>
              <option value="shower-chair">洗澡椅</option>
              <option value="walker">助行器</option>
              <option value="cane-crutch">手／拐杖</option>
              <option value="quad-cane">四腳拐</option>
              <option value="accessories">輔助用品</option>
              <option value="parts-accessories">配件</option>
            </select>
          </div>

          <div class="field full">
            <label for="shortDescription">簡短介紹</label>
            <input id="shortDescription" type="text" placeholder="顯示在商品卡片上的簡短描述">
          </div>

          <div class="field full">
            <label for="description">完整商品說明</label>
            <textarea id="description" placeholder="輸入完整商品介紹"></textarea>
          </div>

          <div class="field">
            <label for="subsidy">補助資訊</label>
            <input id="subsidy" type="text" placeholder="例如：符合補助項目...">
          </div>

          <div class="field hidden" aria-hidden="true">
            <label for="sortOrder">排序</label>
            <input id="sortOrder" type="number" value="0" tabindex="-1">
          </div>

          <div class="full checkbox-row">
            <label class="check-label">
              <input id="isActive" type="checkbox" checked>商品上架</label>

            <label class="check-label">
              <input id="featured" type="checkbox">首頁推薦</label>

            <label class="check-label">
              <input id="isWeikang" type="checkbox">上架維康專區</label>
          </div>

          <div id="weikangCodeField" class="field full weikang-code-field hidden">
            <label for="weikangCode">維康碼</label>
            <input id="weikangCode" type="text" inputmode="numeric"
                   placeholder="輸入此商品的維康一維碼">
            <div class="hint" style="margin-top:6px;margin-bottom:0;">勾選「上架維康專區」後，此商品會顯示在維康專區，並以此欄位產生一維條碼。</div>
          </div>

          <div class="full section-box">
            <h4>商品圖片</h4>
            <div class="hint">可一次選擇多張圖片。圖片會上傳到富立德自己的 Supabase Storage。</div>

            <div class="image-upload">
              <div>選擇商品圖片</div>
              <input id="imageFiles" type="file" accept="image/*" multiple>
            </div>

            <div id="imagePreview" class="image-preview"></div>
          </div>

          <div class="full section-box">
            <h4>商品特色</h4>
            <div class="hint">例如：輕量化鋁合金／扶手可掀／可折疊</div>
            <div id="featuresList" class="dynamic-list"></div>
            <button type="button" class="add-row-btn" data-add="feature">＋ 新增特色</button>
          </div>

          <div class="full section-box">
            <h4>產品規格</h4>
            <div class="hint">左邊填規格名稱，右邊填數值，例如「座寬 / 42 cm」。</div>
            <div id="specsList" class="dynamic-list"></div>
            <button type="button" class="add-row-btn" data-add="spec">＋ 新增規格</button>
          </div>

          <div class="full section-box">
            <h4>型號 / 尺寸</h4>
            <div class="hint">可建立多組型號。左邊為型號名稱，右邊可填尺寸或備註。</div>
            <div id="variantsList" class="dynamic-list"></div>
            <button type="button" class="add-row-btn" data-add="variant">＋ 新增型號</button>
          </div>
        </div>
      </div>

      <div class="save-bar">
        <button id="cancelModalBtn" type="button" class="cancel-btn">取消</button>
        <button id="saveProductBtn" type="submit" class="save-btn">儲存商品</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

function makeImageItem(type, value){
  const item = { id:`img-${++imageItemSeq}`, type };
  if(type === "existing"){
    item.url = value;
    item.previewUrl = value;
  }else{
    item.file = value;
    item.previewUrl = URL.createObjectURL(value);
  }
  return item;
}

function clearImageItems(){
  imageItems.forEach(item => {
    if(item.type === "new" && item.previewUrl){
      URL.revokeObjectURL(item.previewUrl);
    }
  });
  imageItems = [];
}

const $ = id => document.getElementById(id);

function esc(value){
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

function escAttr(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function showToast(message){
  const el = $("toast");
  el.textContent = message;
  el.classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.classList.add("hidden"), 2600);
}

function slugify(name){
  const base = String(name || "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g,"-")
    .replace(/[^\w\u4e00-\u9fff-]/g,"")
    .replace(/-+/g,"-");

  return (base || "product") + "-" + Date.now();
}

async function ensureAdmin(session){

    return false;

  if(session.user.id !== ADMIN_UID){
    await db.auth.signOut();
    $("loginMsg").textContent = "此帳號沒有管理權限。";
    showLogin();
    return false;
  }

  showAdmin();
  await loadProducts();
  return true;
}

function setAdminVisible(visible){
  $("loginPage").classList.toggle("hidden", visible);
  $("adminPage").classList.toggle("hidden", !visible);
}
const showLogin = () => setAdminVisible(false);
const showAdmin = () => setAdminVisible(true);

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  $("loginMsg").textContent = "登入中...";

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  const { data, error } = await db.auth.signInWithPassword({
    email,

  });

  if(error){
    $("loginMsg").textContent = "登入失敗：" + error.message;
    return;
  }

  await ensureAdmin(data.session);

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();

});

async function loadProducts(){
  $("productList").innerHTML =
    '<div class="empty-box">商品載入中...</div>';

  const { data, error } = await db
    .from("products")
    .select("*")
    .order("sort_order", { ascending:true })
    .order("created_at", { ascending:false });

  if(error){
    $("productList").innerHTML =
      '<div class="empty-box">商品讀取失敗：' + esc(error.message) + '</div>';
    return;
  }

  products = data || [];
  updateStats();
  renderProducts();
}

function updateStats(){
  $("statAll").textContent = products.length;
  $("statActive").textContent =
    products.filter(p => p.is_active).length;
  $("statInactive").textContent =
    products.filter(p => !p.is_active).length;
}

const CATEGORY_INDEX = new Map(CATEGORY_ORDER.map((value,index) => [value,index]));
const productById = id => products.find(p => p.id === id);
const withinCategoryOrder = (a,b) =>
  Number(a.sort_order ?? 0) - Number(b.sort_order ?? 0) ||
  String(a.created_at || "").localeCompare(String(b.created_at || ""));
const productOrder = (a,b) =>
  (CATEGORY_INDEX.get(a.category) ?? CATEGORY_ORDER.length) -
  (CATEGORY_INDEX.get(b.category) ?? CATEGORY_ORDER.length) ||
  withinCategoryOrder(a,b);

function nextSortOrder(category){
  const orders = products
    .filter(p => p.category === category)
    .map(p => Number(p.sort_order ?? 0));
  return orders.length ? Math.max(...orders) + 1 : 1;
}

function filteredProducts(){
  const keyword = $("searchInput").value.trim().toLowerCase();
  const status = $("statusFilter").value;
  const category = $("categoryFilter").value;

  return products
    .filter(p => {
      const haystack = [p.name,p.short_description,p.description,p.category]
        .join(" ").toLowerCase();
      return (!keyword || haystack.includes(keyword)) &&
        (category === "all" || p.category === category) &&
        (status === "all" ||
          (status === "active" && p.is_active) ||
          (status === "inactive" && !p.is_active));
    })
    .sort(productOrder);
}

function renderProducts(){
  const rows = filteredProducts();

  if(!rows.length){
    $("productList").innerHTML =
      '<div class="empty-box">目前沒有符合條件的商品。</div>';
    return;
  }

  $("productList").innerHTML = rows.map(p => {
    const image =
      Array.isArray(p.image_urls) && p.image_urls.length
        ? p.image_urls[0]
        : "";

    return `
      <article class="product-row" data-product-id="${p.id}" data-category="${escAttr(p.category || "")}">
        <button class="drag-handle" type="button" aria-label="拖曳調整排序" title="拖曳調整排序">☰</button>
        <div class="thumb">
          ${
            image
              ? `<img src="${escAttr(image)}" alt="${escAttr(p.name)}">`
              : "尚無圖片"
          }
        </div>

        <div>
          <div class="product-name">${esc(p.name)}</div>
          <div class="product-desc">${esc(p.short_description || p.description || "尚未填寫商品介紹")}</div>
        </div>

        <div>
          <strong>${esc(categoryNames[p.category] || p.category || "未分類")}</strong>
        </div>

        <div>
          <span class="pill ${p.is_active ? "active" : "inactive"}">${p.is_active ? "● 上架中" : "● 已下架"}</span>

          ${
            p.featured
              ? '<span class="pill featured">★ 首頁推薦</span>'
              : ""
          }

          ${
            p.is_weikang
              ? '<span class="pill weikang">維康專區</span>'
              : ""
          }
        </div>

        <div class="row-actions">
          <button class="small-btn" type="button" data-action="edit" data-id="${p.id}">編輯</button>

          <button
            class="small-btn warn"
            type="button"
            data-action="toggle"
            data-id="${p.id}"
            data-active="${p.is_active}">${p.is_active ? "下架" : "重新上架"}</button>

          <button
            class="small-btn"
            type="button"
            data-action="duplicate"
            data-id="${p.id}">複製</button>

          <button
            class="small-btn danger"
            type="button"
            data-action="delete"
            data-id="${p.id}">刪除</button>
        </div>
      </article>
    `;
  }).join("");

  bindProductActionEvents();
  initProductSorting();
}

let productSortable = null;
let isSavingSort = false;

function bindProductActionEvents(){
  const host = $("productList");
  if(!host) return;

  host.querySelectorAll("button[data-action]").forEach(button => {
    button.addEventListener("pointerdown", event => event.stopPropagation());
    button.addEventListener("mousedown", event => event.stopPropagation());
    button.onclick = async event => {
      event.preventDefault();
      event.stopPropagation();

      const id = button.dataset.id;
      const action = button.dataset.action;

      try{
        if(action === "edit"){
          window.editProduct(id);
        }else if(action === "toggle"){
          await window.toggleStatus(id, button.dataset.active === "true");
        }else if(action === "duplicate"){
          await window.duplicateProduct(id);
        }else if(action === "delete"){
          await window.deleteProduct(id);
        }
      }catch(error){
        console.error("商品操作失敗：", error);
        alert("操作失敗，請重新整理頁面後再試。");
      }
    };
  });
}

function initProductSorting(){
  const host = $("productList");
  if(!host || typeof Sortable === "undefined") return;

  if(productSortable){
    productSortable.destroy();
    productSortable = null;
  }

  const rows = host.querySelectorAll(".product-row");
  if(!rows.length) return;

  productSortable = Sortable.create(host, {
    animation: 180,
    handle: ".drag-handle",
    draggable: ".product-row",

    filter: ".row-actions, .row-actions *, input, select, textarea, a",
    preventOnFilter: false,

    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen",
    dragClass: "sortable-drag",

    scroll: true,
    bubbleScroll: true,
    scrollSensitivity: 120,
    scrollSpeed: 22,
    forceAutoScrollFallback: true,

    onMove: evt => {
      const draggedCategory = evt.dragged?.dataset?.category || "";
      const relatedCategory = evt.related?.dataset?.category || "";
      return !relatedCategory || draggedCategory === relatedCategory;
    },

    onEnd: async () => {
      if(isSavingSort) return;
      await saveDraggedOrder();
    }
  });
}

async function saveDraggedOrder(){
  const host = $("productList");
  const visibleRows = [...host.querySelectorAll(".product-row")];
  if(!visibleRows.length) return;

  isSavingSort = true;

  try{
    // 找出目前畫面上有被拖曳排序的分類
    const categoriesOnScreen = [
      ...new Set(visibleRows.map(row => row.dataset.category).filter(Boolean))
    ];

    for(const category of categoriesOnScreen){
      const visibleCategoryRows = visibleRows.filter(
        row => row.dataset.category === category
      );
      if(!visibleCategoryRows.length) continue;

      const visibleIds = visibleCategoryRows.map(row => row.dataset.productId);
      const visibleSet = new Set(visibleIds);

      // 只處理同一分類；其他分類完全不受影響
      const allInCategory = products
        .filter(p => p.category === category)
        .sort(withinCategoryOrder);

      const reorderedVisible = visibleIds.map(productById).filter(Boolean);

      let visibleIndex = 0;
      const merged = allInCategory.map(product => {
        if(visibleSet.has(product.id)){
          return reorderedVisible[visibleIndex++];
        }
        return product;
      });

      const updates = merged.map((product,index) => ({
        id: product.id,
        sort_order: index + 1
      }));

      const results = await Promise.all(
        updates.map(item =>
          db.from("products")
            .update({ sort_order:item.sort_order })
            .eq("id", item.id)
        )
      );

      const failed = results.find(result => result.error);
      if(failed){
        throw new Error(failed.error.message);
      }

      updates.forEach(item => {
        const product = productById(item.id);
        if(product) product.sort_order = item.sort_order;
      });
    }

    // 重新渲染，分類固定順序會立即套用
    renderProducts();
    showToast("分類內商品順序已更新");
  }catch(err){
    alert("排序儲存失敗：" + (err.message || String(err)));
    await loadProducts();
  }finally{
    isSavingSort = false;
  }
}

$("searchInput").addEventListener("input", renderProducts);
$("statusFilter").addEventListener("change", renderProducts);
$("categoryFilter").addEventListener("change", renderProducts);

$("productCategory").addEventListener("change", () => {
  if(!editingId) $("sortOrder").value = nextSortOrder($("productCategory").value);
});

const DYNAMIC_LISTS = {
  feature:"featuresList",
  spec:"specsList",
  variant:"variantsList"
};

function clearDynamicLists(){
  Object.values(DYNAMIC_LISTS).forEach(id => $(id).innerHTML = "");
}

function addDynamicRow(type, key="", value=""){
  const host = $(DYNAMIC_LISTS[type]);
  const row = document.createElement("div");
  row.className = "dynamic-row";
  row.dataset.type = type;

  if(type === "feature"){
    row.innerHTML = `
      <input class="row-key" type="text"
             placeholder="商品特色"
             value="${escAttr(key || value)}">
      <input class="row-value" type="hidden" value="">
      <button type="button" class="remove-row">刪除</button>
    `;
  }else{
    row.innerHTML = `
      <input class="row-key" type="text"
             placeholder="${type === "spec" ? "名稱" : "型號"}"
             value="${escAttr(key)}">
      <input class="row-value" type="text"
             placeholder="${type === "spec" ? "數值" : "尺寸 / 備註"}"
             value="${escAttr(value)}">
      <button type="button" class="remove-row">刪除</button>
    `;
  }

  row.querySelector(".remove-row")
    .addEventListener("click", () => row.remove());

  host.appendChild(row);
}

document.querySelectorAll("[data-add]").forEach(btn => {
  btn.addEventListener("click", () => {
    addDynamicRow(btn.dataset.add);
  });
});

function collectRows(hostId, featureOnly=false){
  return [...$(hostId).querySelectorAll(".dynamic-row")]
    .map(row => {
      const name = row.querySelector(".row-key").value.trim();
      if(featureOnly) return name;
      return { name, value:row.querySelector(".row-value").value.trim() };
    })
    .filter(item => featureOnly ? Boolean(item) : item.name || item.value);
}

const collectFeatures = () => collectRows("featuresList", true);
const collectPairs = hostId => collectRows(hostId);

function normalizePairs(input){
  if(!Array.isArray(input)) return [];

  return input.map(item => {
    if(typeof item === "string"){
      return { name:item, value:"" };
    }

    return {
      name: item?.name ?? item?.label ?? item?.key ?? "",
      value: item?.value ?? item?.text ?? item?.size ?? ""
    };
  });
}

function updateWeikangField(){
  const enabled = $("isWeikang").checked;
  $("weikangCodeField").classList.toggle("hidden", !enabled);
}

$("isWeikang").addEventListener("change", updateWeikangField);

function openModal(product=null){
  $("productForm").reset();
  $("productId").value = "";
  $("sortOrder").value = nextSortOrder($("productCategory").value);
  $("isActive").checked = true;
  $("featured").checked = false;
  $("isWeikang").checked = false;
  $("weikangCode").value = "";
  updateWeikangField();
  clearDynamicLists();

  clearImageItems();
  $("imageFiles").value = "";

  if(product){
    $("modalTitle").textContent = "編輯商品";
    $("productId").value = product.id;
    $("productName").value = product.name || "";
    $("productCategory").value =
      product.category || "aluminum-wheelchair";
    $("shortDescription").value =
      product.short_description || "";
    $("description").value = product.description || "";
    $("subsidy").value = product.subsidy || "";
    $("sortOrder").value = product.sort_order ?? 0;
    $("isActive").checked = product.is_active !== false;
    $("featured").checked = product.featured === true;
    $("isWeikang").checked = product.is_weikang === true;
    $("weikangCode").value = product.weikang_code || "";
    updateWeikangField();

    imageItems =
      (Array.isArray(product.image_urls) ? product.image_urls : [])
        .map(url => makeImageItem("existing", url));

    (Array.isArray(product.features) ? product.features : [])
      .forEach(item => {
        if(typeof item === "string"){
          addDynamicRow("feature", item);
        }else{
          addDynamicRow("feature",
            item?.text ?? item?.name ?? item?.value ?? "");
        }
      });

    normalizePairs(product.specs)
      .forEach(item => addDynamicRow("spec", item.name, item.value));

    normalizePairs(product.variants)
      .forEach(item => addDynamicRow("variant", item.name, item.value));

  }else{
    $("modalTitle").textContent = "新增商品";
    addDynamicRow("feature");

    // 新增商品時，自動建立常用規格
    [
      "座寬",
      "座深",
      "座高",
      "總寬",
      "總高",
      "總長",
      "淨重"
    ].forEach(name => addDynamicRow("spec", name, ""));

    addDynamicRow("variant");
  }

  renderImagePreview();
  $("productModal").classList.remove("hidden");
}

function closeModal(){
  $("productModal").classList.add("hidden");
  if(imagePreviewSortable){
    imagePreviewSortable.destroy();
    imagePreviewSortable = null;
  }
}

$("newProductBtn").addEventListener("click", () => openModal());
$("closeModalBtn").addEventListener("click", closeModal);
$("cancelModalBtn").addEventListener("click", closeModal);

$("productModal").addEventListener("click", e => {
  if(e.target === $("productModal")){
    closeModal();
  }
});

window.editProduct = id => {
  const product = productById(id);
  if(product) openModal(product);
};

$("imageFiles").addEventListener("change", e => {
  Array.from(e.target.files || [])
    .forEach(file => imageItems.push(makeImageItem("new", file)));
  renderImagePreview();
  e.target.value = "";
});

function addPreviewItem(host, item){
  const el = document.createElement("div");
  el.className = "preview-item";
  el.dataset.imageId = item.id;
  el.innerHTML = `<img src="${escAttr(item.previewUrl)}" alt="商品圖片">
    <button type="button" class="preview-remove" title="移除圖片">×</button>`;

  const removeBtn = el.querySelector("button");
  removeBtn.addEventListener("pointerdown", e => e.stopPropagation());
  removeBtn.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();

    const index = imageItems.findIndex(x => x.id === item.id);
    if(index < 0) return;

    const [removed] = imageItems.splice(index,1);
    if(removed.type === "new" && removed.previewUrl){
      URL.revokeObjectURL(removed.previewUrl);
    }
    renderImagePreview();
  });

  host.appendChild(el);
}

function initImagePreviewSorting(){
  const host = $("imagePreview");
  if(!host || typeof Sortable === "undefined") return;

  if(imagePreviewSortable){
    imagePreviewSortable.destroy();
    imagePreviewSortable = null;
  }

  imagePreviewSortable = Sortable.create(host,{
    animation:160,
    draggable:".preview-item",
    filter:".preview-remove",
    preventOnFilter:false,
    ghostClass:"sortable-ghost",
    chosenClass:"sortable-chosen",
    onEnd(){
      const byId = new Map(imageItems.map(item => [item.id,item]));
      imageItems = [...host.querySelectorAll(".preview-item")]
        .map(el => byId.get(el.dataset.imageId))
        .filter(Boolean);
    }
  });
}

function renderImagePreview(){
  const host = $("imagePreview");
  host.innerHTML = "";
  imageItems.forEach(item => addPreviewItem(host,item));
  initImagePreviewSorting();
}

async function uploadImageFile(file){
  const ext =
    (file.name.split(".").pop() || "jpg")
      .toLowerCase()
      .replace(/[^a-z0-9]/g,"");

  const path =
    `${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;

  const { error } = await db.storage
    .from(STORAGE_BUCKET)
    .upload(path,file,{
      cacheControl:"3600",
      upsert:false,
      contentType:file.type || undefined
    });

  if(error){
    throw new Error("圖片上傳失敗：" + error.message);
  }

  const { data } = db.storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(path);

  return data.publicUrl;
}

async function resolveImageUrls(){
  const urls = [];

  for(const item of imageItems){
    if(item.type === "existing"){
      urls.push(item.url);
    }else{
      urls.push(await uploadImageFile(item.file));
    }
  }

  return urls;
}

$("productForm").addEventListener("submit", async e => {
  e.preventDefault();

  const btn = $("saveProductBtn");
  btn.disabled = true;
  btn.textContent = "儲存中...";

  try{
    const name = $("productName").value.trim();

    if(!name){
      throw new Error("請輸入商品名稱");
    }

    const weikangEnabled = $("isWeikang").checked;
    const weikangCode = $("weikangCode").value.trim();

    if(weikangEnabled && !weikangCode){
      throw new Error("已勾選上架維康專區，請輸入維康碼");
    }

    const allImages = await resolveImageUrls();

    const payload = {
      name,
      category: $("productCategory").value,
      short_description: $("shortDescription").value.trim() || null,
      description: $("description").value.trim() || null,
      subsidy: $("subsidy").value.trim() || null,
      sort_order: Number($("sortOrder").value || 0),
      is_active: $("isActive").checked,
      featured: $("featured").checked,
      is_weikang: weikangEnabled,
      weikang_code: weikangEnabled ? weikangCode : null,
      image_urls: allImages,
      features: collectFeatures(),
      specs: collectPairs("specsList"),
      variants: collectPairs("variantsList")
    };

    const id = $("productId").value;

    let result;

    if(id){
      result = await db
        .from("products")
        .update(payload)
        .eq("id", id);
    }else{
      payload.slug = slugify(name);

      result = await db
        .from("products")
        .insert(payload);
    }

    if(result.error){
      throw new Error(result.error.message);
    }

    closeModal();
    showToast(id ? "商品已更新" : "商品已新增");
    await loadProducts();

  }catch(err){
    alert(err.message || String(err));
  }finally{
    btn.disabled = false;
    btn.textContent = "儲存商品";
  }
});

async function runProductMutation(query, errorPrefix, successMessage){
  const { error } = await query;
  if(error){
    alert(errorPrefix + error.message);
    return false;
  }
  showToast(successMessage);
  await loadProducts();
  return true;
}

window.toggleStatus = async function(id,current){
  const action = current ? "下架" : "重新上架";

  if(!confirm(`確定要${action}這項商品嗎？`)){
    return;
  }

  await runProductMutation(
    db.from("products").update({ is_active:!current }).eq("id", id),
    "狀態更新失敗：",
    `商品已${action}`
  );
};

window.duplicateProduct = async function(id){
  const original = productById(id);
  if(!original) return;

  if(!confirm(`要複製「${original.name}」嗎？`)){
    return;
  }

  const copy = {
    name: original.name + " - 複製",
    slug: slugify(original.name + "-copy"),
    category: original.category,
    short_description: original.short_description,
    description: original.description,
    features: original.features || [],
    specs: original.specs || [],
    variants: original.variants || [],
    subsidy: original.subsidy,
    image_urls: original.image_urls || [],
    featured: false,
    is_weikang: false,
    weikang_code: null,
    is_active: false,
    sort_order: original.sort_order ?? 0
  };

  await runProductMutation(
    db.from("products").insert(copy),
    "複製失敗：",
    "商品已複製，預設為下架"
  );
};

window.deleteProduct = async function(id){
  const product = productById(id);
  if(!product) return;

  if(!confirm(
    `確定要刪除「${product.name}」嗎？\n\n刪除後商品資料無法復原。`
  )){
    return;
  }

  await runProductMutation(
    db.from("products").delete().eq("id", id),
    "刪除失敗：",
    "商品已刪除"
  );
};

(async function init(){
  const { data } = await db.auth.getSession();
  await ensureAdmin(data.session);

  db.auth.onAuthStateChange((_event, session) => {
    if(!session){
      showLogin();
    }
  });
})();
