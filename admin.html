<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>富致康醫療器材｜管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f5f8fa;color:#263238}button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#075b82,#079bd8);padding:24px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 35px rgba(0,0,0,.12)}.login-box{width:min(430px,100%);padding:36px}h1,h2,h3{color:#164c65}
.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #d6e1e6;border-radius:8px}textarea{min-height:100px;resize:vertical}
.primary{border:0;background:#0797d3;color:#fff;border-radius:8px;padding:11px 18px;font-weight:700}.full{width:100%}.error{color:#bd2d2d;margin-top:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);gap:12px}header strong{color:#0797d3;font-size:20px}
.header-actions{display:flex;gap:8px}.header-actions a,.header-actions button{padding:9px 13px;border:1px solid #d9e3e7;border-radius:7px;background:#fff;text-decoration:none;color:#333}
main{width:92%;max-width:1280px;margin:32px auto 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.table-wrap{overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.05)}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #edf1f3;text-align:left}th{background:#f8fafb;color:#607d8b}
.thumb{width:64px;height:64px;object-fit:contain;background:#f7f9fa;border-radius:7px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 9px;border:1px solid #d9e3e7;background:#fff;border-radius:6px}
.editor{margin-top:24px;padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.span2{grid-column:1/-1}.checks{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0}.checks label{display:flex;gap:7px;align-items:center;font-weight:400}.checks input{width:auto}
.section{border-top:1px solid #e8edef;margin-top:24px;padding-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.soft{border:0;background:#e8f7fc;color:#0797d3;border-radius:7px;padding:8px 12px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}.row1{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.remove{border:0;background:#fff0ee;color:#b32a1f;border-radius:7px;padding:8px 10px}
.previews{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.preview{width:110px;height:110px;position:relative;border:1px solid #dfe7ea;border-radius:8px;overflow:hidden;background:#f8fafb}.preview img{width:100%;height:100%;object-fit:contain}.preview button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:25px;height:25px;background:#0009;color:white}
.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#eee}.on{background:#e5f6ec;color:#19734a}.hot{color:#d35400;font-weight:700}
.msg{margin-top:12px;color:#176182}
.variant-card{margin:14px 0;padding:18px;border:1px solid #dce7eb;border-radius:12px;background:#f8fbfc}
.variant-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:12px}
.variant-specs{margin-top:8px}
.variant-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.copy-variant{border:0;background:#eef7fb;color:#176182;border-radius:7px;padding:8px 12px;font-weight:700}
.copy-variant:hover{background:#dff1f8}
@media(max-width:760px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.row2,.row1{grid-template-columns:1fr}header,.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<section id="loginPage" class="login">
  <div class="card login-box">
    <h1>富致康管理後台</h1>
    <p>商品管理系統</p>
    <div class="field"><label>管理員 Email</label><input id="email" type="email"></div>
    <div class="field"><label>密碼</label><input id="password" type="password"></div>
    <button id="loginBtn" class="primary full">登入</button>
    <div id="loginMsg" class="error"></div>
  </div>
</section>

<div id="adminPage" class="hidden">
<header>
  <strong>富致康醫療器材｜商品管理</strong>
  <div class="header-actions">
    <a href="index.html" target="_blank">查看網站</a>
    <button id="logoutBtn">登出</button>
  </div>
</header>

<main>
  <div class="top">
    <div><h1>商品管理</h1><p>新增、修改、上架與管理商品</p></div>
    <button id="newBtn" class="primary">＋ 新增商品</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>圖片</th><th>商品</th><th>分類</th><th>熱賣</th><th>狀態</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <section id="editor" class="card editor hidden">
    <div class="top"><h2 id="editorTitle">新增商品</h2><button id="closeBtn">關閉</button></div>
    <input id="id" type="hidden">

    <div class="grid">
      <div class="field"><label>商品名稱</label><input id="name" placeholder="例如：FZK-AB 躺舒芙"></div>
      <div class="field"><label>商品分類</label>
        <select id="category">
          <option value="aluminum-wheelchair">鋁製輪椅</option>
          <option value="steel-wheelchair">鐵製輪椅</option>
          <option value="rollator">助步車</option>
          <option value="commode-chair">便椅</option>
          <option value="shower-chair">洗澡椅</option>
          <option value="walker">助行器</option>
          <option value="cane-crutch">手／拐杖</option>
          <option value="quad-cane">四腳拐</option>
          <option value="accessories">輔助用品</option>
        </select>
      </div>
      <div class="field span2"><label>商品簡介</label><textarea id="short"></textarea></div>
      <div class="field span2"><label>詳細介紹</label><textarea id="desc"></textarea></div>
      <div class="field"><label>補助項目</label><input id="subsidy" placeholder="例如：輪椅-B款・附加A"></div>
      <div class="field"><label>排序</label><input id="sort" type="number" value="0"></div>
    </div>

    <div class="checks">
      <label><input id="featured" type="checkbox"> 設為熱賣商品</label>
      <label><input id="active" type="checkbox" checked> 商品上架</label>
    </div>

    <div class="section">
      <div class="section-head"><h3>商品特色</h3><button id="addFeature" class="soft">＋ 新增特色</button></div>
      <div id="features"></div>
    </div>

    <div class="section">
      <div class="section-head"><h3>產品規格</h3><button id="addSpec" class="soft">＋ 新增規格</button></div>
      <div id="specs"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div>
          <h3>型號／尺寸規格</h3>
          <div style="color:#78909c;font-size:14px">同一商品若有不同型號或尺寸，可在這裡分別建立規格。</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="addVariant" class="soft">＋ 新增空白型號</button>
          <button id="addVariantLikeFirst" class="soft">＋ 比照第一個新增</button>
        </div>
      </div>
      <div id="variants"></div>
    </div>

    <div class="section">
      <h3>商品圖片</h3>
      <div class="field"><input id="files" type="file" accept="image/*" multiple></div>
      <div id="previews" class="previews"></div>
    </div>

    <div style="margin-top:24px;text-align:right"><button id="saveBtn" class="primary">儲存商品</button></div>
    <div id="saveMsg" class="msg"></div>
  </section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://sdkgiedglmhmchiietru.supabase.co";
const SUPABASE_KEY="sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let images=[];

async function isAdmin(){
  const {data,error}=await db.rpc("is_admin");
  return !error && data===true;
}
async function boot(){
  const {data}=await db.auth.getSession();
  if(data.session && await isAdmin()) showAdmin(); else showLogin();
}
function showLogin(msg=""){$("loginPage").classList.remove("hidden");$("adminPage").classList.add("hidden");$("loginMsg").textContent=msg}
function showAdmin(){$("loginPage").classList.add("hidden");$("adminPage").classList.remove("hidden");load()}

$("loginBtn").onclick=async()=>{
  $("loginMsg").textContent="登入中...";
  const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error) return showLogin("登入失敗："+error.message);
  if(!(await isAdmin())){await db.auth.signOut();return showLogin("此帳號沒有管理員權限")}
  showAdmin();
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").onclick=async()=>{await db.auth.signOut();showLogin()};

const cname=c=>({"aluminum-wheelchair":"鋁製輪椅","steel-wheelchair":"鐵製輪椅","rollator":"助步車","commode-chair":"便椅","shower-chair":"洗澡椅","walker":"助行器","cane-crutch":"手／拐杖","quad-cane":"四腳拐","accessories":"輔助用品"}[c]||c);
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function load(){
  $("tbody").innerHTML='<tr><td colspan="6">載入中...</td></tr>';
  const {data,error}=await db.from("products").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:false});
  if(error) return $("tbody").innerHTML='<tr><td colspan="6">讀取失敗：'+esc(error.message)+'</td></tr>';
  $("tbody").innerHTML=data.length?"":'<tr><td colspan="6">目前沒有商品</td></tr>';
  data.forEach(p=>{
    const tr=document.createElement("tr"), img=p.image_urls?.[0]||"";
    tr.innerHTML=`<td>${img?`<img class="thumb" src="${esc(img)}">`:"無圖片"}</td><td>${esc(p.name)}</td><td>${cname(p.category)}</td><td>${p.featured?'<span class="hot">熱賣</span>':"-"}</td><td><span class="status ${p.is_active?"on":""}">${p.is_active?"上架":"下架"}</span></td><td><div class="actions"><button data-e="${p.id}">編輯</button><button data-d="${p.id}">刪除</button></div></td>`;
    $("tbody").appendChild(tr);
  });
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(b.dataset.e));
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>del(b.dataset.d));
}

function addFeature(v=""){
  const r=document.createElement("div");r.className="row1";
  r.innerHTML='<input class="fv" placeholder="例如：鋁合金材質"><button class="remove">刪除</button>';
  r.querySelector("input").value=v;r.querySelector("button").onclick=()=>r.remove();$("features").appendChild(r);
}
function addSpec(n="",v=""){
  const r=document.createElement("div");r.className="row2";
  r.innerHTML='<input class="sn" placeholder="規格名稱，例如：座寬"><input class="sv" placeholder="例如：45 cm"><button class="remove">刪除</button>';
  r.querySelector(".sn").value=n;r.querySelector(".sv").value=v;r.querySelector("button").onclick=()=>r.remove();$("specs").appendChild(r);
}

function addVariantSpec(container,n="",v=""){
  const r=document.createElement("div");r.className="row2 variant-spec-row";
  r.innerHTML='<input class="vsn" placeholder="規格名稱，例如：座寬"><input class="vsv" placeholder="例如：42cm"><button type="button" class="remove">刪除</button>';
  r.querySelector(".vsn").value=n;
  r.querySelector(".vsv").value=v;
  r.querySelector(".remove").onclick=()=>r.remove();
  container.appendChild(r);
}

function addVariant(model="",specs=null){
  const card=document.createElement("div");
  card.className="variant-card";
  card.innerHTML=`
    <div class="variant-top">
      <div class="field" style="margin:0">
        <label>型號／尺寸名稱</label>
        <input class="variant-model" placeholder="例如：AC1616">
      </div>
      <button type="button" class="remove remove-variant">刪除此型號</button>
    </div>
    <div><strong style="color:#164c65">此型號規格</strong></div>
    <div class="variant-specs"></div>
    <div class="variant-actions">
      <button type="button" class="soft add-variant-spec">＋ 新增規格</button>
      <button type="button" class="copy-variant duplicate-variant">複製此型號</button>
    </div>`;
  card.querySelector(".variant-model").value=model;
  const box=card.querySelector(".variant-specs");
  card.querySelector(".add-variant-spec").onclick=()=>addVariantSpec(box);
  card.querySelector(".remove-variant").onclick=()=>card.remove();
  card.querySelector(".duplicate-variant").onclick=()=>{
    const currentModel=card.querySelector(".variant-model").value.trim();
    const currentSpecs=[...card.querySelectorAll(".variant-spec-row")].map(r=>({
      name:r.querySelector(".vsn").value.trim(),
      value:r.querySelector(".vsv").value.trim()
    }));
    addVariant(currentModel ? currentModel + "-copy" : "", currentSpecs);
  };
  $("variants").appendChild(card);

  if(Array.isArray(specs) && specs.length){
    specs.forEach(s=>addVariantSpec(box,s.name||"",s.value||""));
  }else{
    ["座寬","座深","座高","總寬","總高","總長","承重","淨重"].forEach(n=>addVariantSpec(box,n,""));
  }
}

function getVariants(){
  return [...document.querySelectorAll(".variant-card")].map(card=>{
    const model=card.querySelector(".variant-model").value.trim();
    const specs=[...card.querySelectorAll(".variant-spec-row")].map(r=>({
      name:r.querySelector(".vsn").value.trim(),
      value:r.querySelector(".vsv").value.trim()
    })).filter(s=>s.name&&s.value);
    return {model,specs};
  }).filter(v=>v.model || v.specs.length);
}

function addVariantLikeFirst(){
  const first=$("variants").querySelector(".variant-card");
  if(!first){
    addVariant();
    return;
  }

  const specs=[...first.querySelectorAll(".variant-spec-row")].map(r=>({
    name:r.querySelector(".vsn").value.trim(),
    value:r.querySelector(".vsv").value.trim()
  }));

  addVariant("",specs);
}
$("addFeature").onclick=()=>addFeature();
$("addSpec").onclick=()=>addSpec();
$("addVariant").onclick=()=>addVariant();
$("addVariantLikeFirst").onclick=()=>addVariantLikeFirst();

function defaults(){
  ["座寬","座深","座高","總寬","總高","總長","承重","淨重","前輪尺寸","後輪尺寸","材質"].forEach(n=>addSpec(n,""));
}
function renderImages(){
  $("previews").innerHTML="";
  images.forEach((u,i)=>{
    const d=document.createElement("div");d.className="preview";
    d.innerHTML=`<img src="${esc(u)}"><button>×</button>`;
    d.querySelector("button").onclick=()=>{images.splice(i,1);renderImages()};
    $("previews").appendChild(d);
  });
}
async function upload(){
  for(const f of Array.from($("files").files)){
    const ext=(f.name.split(".").pop()||"jpg").toLowerCase();
    const path="products/"+crypto.randomUUID()+"."+ext;
    const {error}=await db.storage.from("product-images").upload(path,f);
    if(error) throw error;
    images.push(db.storage.from("product-images").getPublicUrl(path).data.publicUrl);
  }
  $("files").value="";
}

function reset(useDefaults=true){
  ["id","name","short","desc","subsidy"].forEach(x=>$(x).value="");
  $("category").value="aluminum-wheelchair";$("sort").value=0;$("featured").checked=false;$("active").checked=true;
  $("features").innerHTML="";$("specs").innerHTML="";$("variants").innerHTML="";images=[];renderImages();$("saveMsg").textContent="";
  addFeature();if(useDefaults)defaults();
}
$("newBtn").onclick=()=>{reset();$("editorTitle").textContent="新增商品";$("editor").classList.remove("hidden");$("editor").scrollIntoView({behavior:"smooth"})};
$("closeBtn").onclick=()=>$("editor").classList.add("hidden");

$("saveBtn").onclick=async()=>{
  const btn=$("saveBtn");btn.disabled=true;btn.textContent="儲存中...";$("saveMsg").textContent="";
  try{
    await upload();
    const name=$("name").value.trim();if(!name) throw new Error("請輸入商品名稱");
    const features=[...document.querySelectorAll(".fv")].map(x=>x.value.trim()).filter(Boolean);
    const specs=[...$("specs").querySelectorAll(".row2")].map(r=>({name:r.querySelector(".sn").value.trim(),value:r.querySelector(".sv").value.trim()})).filter(x=>x.name&&x.value);
    const variants=getVariants();
    const item={name,category:$("category").value,short_description:$("short").value.trim(),description:$("desc").value.trim(),subsidy:$("subsidy").value.trim(),sort_order:Number($("sort").value)||0,featured:$("featured").checked,is_active:$("active").checked,features,specs,variants,image_urls:images};
    let q;
    if($("id").value) q=await db.from("products").update(item).eq("id",$("id").value);
    else{item.slug=(name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"product")+"-"+Date.now();q=await db.from("products").insert(item)}
    if(q.error) throw q.error;
    $("saveMsg").textContent="商品已成功儲存";await load();setTimeout(()=>$("editor").classList.add("hidden"),600);
  }catch(e){$("saveMsg").textContent="儲存失敗："+e.message}
  finally{btn.disabled=false;btn.textContent="儲存商品"}
};

async function edit(id){
  const {data,error}=await db.from("products").select("*").eq("id",id).single();
  if(error)return alert("讀取商品失敗："+error.message);
  reset(false);$("id").value=data.id;$("name").value=data.name||"";$("category").value=data.category||"aluminum-wheelchair";$("short").value=data.short_description||"";$("desc").value=data.description||"";$("subsidy").value=data.subsidy||"";$("sort").value=data.sort_order||0;$("featured").checked=!!data.featured;$("active").checked=!!data.is_active;images=data.image_urls||[];renderImages();
  (data.features||[]).forEach(addFeature);(data.specs||[]).forEach(s=>addSpec(s.name,s.value));(data.variants||[]).forEach(v=>addVariant(v.model||"",v.specs||[]));
  $("editorTitle").textContent="編輯商品";$("editor").classList.remove("hidden");$("editor").scrollIntoView({behavior:"smooth"});
}
async function del(id){
  if(!confirm("確定要刪除這件商品嗎？"))return;
  const {error}=await db.from("products").delete().eq("id",id);
  if(error)return alert("刪除失敗："+error.message);load();
}
boot();
</script>
</body>
</html>
